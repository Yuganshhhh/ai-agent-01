# Name of this Spring Boot application
spring.application.name=ai-agent-tools-demo

# ---------------- AI model settings ----------------
# This project uses Spring AI's OpenAI-compatible client, pointed at Google Gemini.
# Each value can be overridden with an environment variable. The part after ':' is the default.

# Base URL of the AI provider (default: Gemini's OpenAI-compatible endpoint)
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}

# Path appended to the base URL for chat requests
spring.ai.openai.chat.completions-path=/chat/completions

# API key for the AI provider (required, no default)
spring.ai.openai.api-key=${OPENAI_API_KEY}

# Model to use (default: gemini-flash-lite-latest)
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gemini-flash-lite-latest}

# ---------------- Tool settings ----------------
# API key for WeatherAPI, used by WeatherTool (required, no default)
weather.api-key=${WEATHER_API_KEY}
